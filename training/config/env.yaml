# 환경 + 학습 공통 설정 — 맵 크기 · 장애물 · 조난자 · UAV · 관측 (env/role/simulation.py) 과 세 정책 공통 PPO / 병렬 수집
# 학습: python -m training.train   (env.yaml + role.yaml + task.yaml 을 합쳐서 쓴다)
# role.yaml = 역할 선택 (이벤트, role 보상, 역할 네트워크) / task.yaml = 하위 할당 (rescue / explore 네트워크, task 보상,
# 덩어리 · 1 단계 · 2 단계). 어느 구성요소를 학습할지는 아래 components
env: rescue_role
framework: torch

# ---- 학습 구성요소: rule = 규칙 정책 / learn = 학습 (path 가 있으면 그 모델의 그 구성요소 가중치에서 시작) ----
#   training/train.py 가 읽고 RLlib 에는 넘기지 않음, 명령줄 --role / --role_path / --rescue / --rescue_path / --explore /
#   --explore_path 가 우선. learn 이 하나 이상이어야 하고, role 이 rule 이면 rescue / explore 도 rule.
#   조합 이름 = <role 모드>_<rescue 모드>_<explore 모드> (learn 에 path 가 있어도 learn) -> run 폴더 marl_models/<조합>_<시각>,
#   best 모델 marl_models/best_model/<조합>/model_vXX (예: learn_learn_rule)
components:
  role:
    mode: learn                 # rule | learn
    path: null                  # learn 의 시작 가중치 모델 (선택). null = 무작위 초기화 (rule 은 path 무시)
  rescue:
    mode: learn
    path: null
  explore:
    mode: learn
    path: null

# ---- PPO (training/role/ppo.py: Role / Rescue / Explore 3 네트워크, 네트워크별 GAE · critic · ValueNorm · lr · clip) ----
gamma: 0.99                     # 할인율 γ — task SMDP 결정 구간 할인 γ^(t1 - t0) + bootstrap · RLlib 설정
role_gamma: 1.0                 # role 할인율 γ_r — role SMDP 결정 구간 할인 γ_r^(t1 - t0) + bootstrap
                                #   (config_loader 가 model.custom_model_config.role_gamma 로 넣음, train.py 가 RLlib 설정에서 뺌)
lambda: 0.95                    # GAE 계수
kl_coeff: 0.2                   # 이전 정책과의 KL 패널티 초기 계수 (헤드 공통, 자동 조절)
kl_target: 0.01                 # 목표 KL
clip_param: 0.2                 # PPO clip 범위 — role 네트워크 (rescue / explore 는 task.yaml <k>.clip_param)
vf_clip_param: 10.0             # value clip — ValueNorm 정규화 공간(표준편차 1) 기준
vf_loss_coeff: 0.5              # critic loss 비중
grad_clip: 10.0                 # gradient norm clip — optimizer param group (네트워크) 마다 따로 (RLlib apply_grad_clipping)
entropy_coeff: 0.0              # (RLlib 용 자리, 실수만 허용) — 실제 계수는 role.yaml role.entropy_coeff / task.yaml rescue · explore.entropy_coeff
lr: 1.0e-4                      # 학습률 (Adam) — role 네트워크의 시작 값 (rescue / explore 는 task.yaml <k>.lr)
lr_schedule: [[0, 1.0e-4], [2000000, 5.0e-5]]   # [timestep, lr] 선형 보간, 이후 마지막 값 유지. 네트워크별 lr 에 배율 lr_schedule(t) / lr 로 적용
train_batch_size: 4000          # 한 번 학습할 때 모으는 env step 수. 결정은 이벤트 때만이라 네트워크별 유효 샘플은 이보다 훨씬 적다
                                # (규칙 정책 기준 role 결정 ≈ 0.5 / step). 학습 로그에 role 결정 < 200 / batch 경고가 뜨면 키울 것
rollout_fragment_length: 200    # 워커가 한 번에 수집하는 step 길이
sgd_minibatch_size: 500         # 미니배치 크기
num_sgd_iter: 3                 # 같은 배치 반복 학습 횟수
batch_mode: truncate_episodes   # fragment 단위로 잘라 수집 (끝은 critic 값으로 bootstrap)
observation_filter: NoFilter    # 관측 정규화 안 함 (env 에서 정규화)

# ---- 병렬 수집 ----
num_workers: 10                  # 데이터 수집 프로세스 수
num_envs_per_worker: 2          # 워커 하나가 동시에 돌리는 환경 수
num_gpus: 1                     # 학습에 쓰는 GPU 수 (0 = CPU, 없으면 train.py 가 자동으로 0)

# ---- 고정 seed 평가 (training/callbacks.py -> training/fixed_seed_eval.py, train.py 가 읽고 RLlib 에는 넘기지 않음) ----
eval:
  every: 25                     # iteration 마다 학습과 별도로 평가 (driver policy, rollout 워커 영향 없음). 0 = 끔
  n_seeds: 10                   # 고정 seed 수 (run_rules 와 같은 seed 0 .. n_seeds-1), 모든 네트워크 argmax 행동
                                #   best = eval 구조율 최대 (같으면 에피소드 길이가 짧은 쪽) -> checkpoints/best/
                                #   학습 중인 모델만 실행 — 기준선 정책은 학습 중 실행하지 않는다
  baselines:                    # 조합 이름별 같은 seed (0 .. n_seeds-1) greedy 평균 구조율 ([eval] 로그 · 그림에만). null = 표시 안 함
    rule_rule_rule: 0.949       # 규칙 정책
    learn_rule_rule: 0.971      # best_model/learn_rule_rule/model_v01
    learn_learn_learn: null

# ---- 학습 그래프 (training/reward_plot.py: fig_training_performance / fig_rewards / fig_learning / fig_behavior /
#      fig_undiscovered, --plot-every 마다) ----
plot:
  ema_window: 10                # EMA 평활 창 (iteration) — 원시값은 연하게, EMA 는 진하게

# ---- 네트워크 공통 (models/role/net.py) — 네트워크별 설정은 role.yaml / task.yaml 의 model ----
model:
  custom_model: role_model      # models/role/rllib_model.py
  custom_action_dist: role_multi_action   # training/role/action_dist.py
  custom_model_config:
    activation: relu            # 활성화 함수
    gnn:                        # 이종 그래프 GNN (models/role/gnn.py, 사양 env/role/graph_obs.py) — 세 네트워크 (role / rescue / explore) 가 같은 설정으로 각자 가짐
      embed_dim: 128            # 노드 임베딩 차원 D
      n_layers: 2               # 메시지 전달 층 수 L (층 · 관계 · 방향마다 파라미터 따로)
      knn_k: 6                  # S–S / F–F / S–F kNN 이웃 수 (k 번째와 거리가 같은 이웃은 모두 포함)
      s_max: 16                 # S (생존자) 노드 수 = 할당 행동의 생존자 슬롯 수 (load_config 가 env_config.s_max 로 넣음)
      attn_heads: 4             # 관계별 이웃 집계 multi-head attention (q = W_q h_v, k / v = W [h_u ‖ e_uv]) 의 head 수 (embed_dim 을 나눠야 함)
                                # loss 가중치 λ_role / λ_rescue / λ_explore 는 role.yaml / task.yaml

env_config:
  # ---- 맵 / 조난자 ----
  map_mode: random              # random: 매 에피소드 장애물 맵을 새로 생성 / file: map_path 의 고정 맵
  map_path: maps/map_target/map1.json # 사용할 맵 — map_mode: file 일 때만
  rows: 40                      # random 맵 크기 (critic state 크기 때문에 학습 중 고정)
  cols: 60
  obstacle_ratio: [0.1, 0.3]    # random 맵 장애물 비율
  min_passage_width: 2          # random 맵 통로 최소 폭 (칸). 2 = 1 칸 틈 / 대각선 끼임 없이 생성, 1 = 제한 없음
  target_mode: random           # random: 매 에피소드 조난자 수/위치 새로 (depot 에서 도달 가능한 칸만)
  num_targets: [20, 50]         # 조난자 수 범위 (양끝 포함)
  target_golden_time: [125, 400]  # 조난자 골든타임 범위 (마감 = 에피소드 시작 기준)
  max_targets: 50               # critic 조난자 슬롯 수 (전체 조난자). num_targets 최댓값 이상
  max_episode_len: 400          # 에피소드 최대 길이 t_max. 시간 / 거리 특징의 정규화 분모
  d_max: null                   # 노드 특징 거리 정규화 분모 (최대 BFS 거리). null = rows + cols = 100 (40 x 60 맵)

  # ---- 관측 ----
  state_size: 21                # local 창 크기 (홀수) — critic local 입력 / waypoint 창
  local_channels: [obstacle, agents]   # local 창 채널
                                # 추가 가능: frontier, explored, target  예) [obstacle, agents, frontier]
  global_downsample: 1          # critic 중앙 state 축소 배율
  n_hop: 4                      # 통신 hop 수. 그룹(지도 병합 · 순차 디코딩 · 공유 클러스터) 범위
  memory:                       # 메모리 노드 (env/role/simulation.py _memory_update): UAV 마다 다른 UAV 의 마지막 기록 (위치, 용량,
                                #   역할, 목표, depot 거리, ω^g, t_last). 매 step 현재 그룹 멤버는 지금 상태로, 그룹 밖 UAV 는 멤버들의
                                #   기록 중 가장 최근 것을 공유 (중계). 그래프 U 노드 = 현재 그룹 + 그룹 밖 기록 (GNN 입력 전용 —
                                #   마스크 · 결정 순서 · ω^g · 보상 · 이벤트에는 안 씀, 위치 추정 없음)
    enabled: true               # false = 현재 그룹만 U 노드
    T_age: 50                   # 메모리 노드 age = min(1, (t - t_last) / T_age)

  # ---- UAV ----
  position_mode: depot          # 모든 UAV 가 depot 에서 출발
  depot: null                   # depot = 모든 UAV 출발 / 재보충 지점, 월드 좌표 (x, y). null = random 맵이면 매 에피소드 랜덤
                                #   (학습은 null — main_gui.py 는 env_gui.yaml 의 고정 depot 을 쓴다)
  capacity: 3                   # UAV 한 대의 구호품 수. depot 에서 재보충
  agents:                       # UAV 별 센서 범위와 통신 범위
    - {sensor_range: 5, comm_range: 10}
    - {sensor_range: 5, comm_range: 10}
    - {sensor_range: 5, comm_range: 10}
    - {sensor_range: 5, comm_range: 10}
    - {sensor_range: 5, comm_range: 10}

  # ---- GUI (python main_gui.py 로 띄울 때만 쓰임 — main_gui.py 는 env_gui.yaml 의 값을 읽는다) ----
  gui:
    cluster_info_max_rows: 8    # inspector Cluster info 에 보여 줄 덩어리 줄 수 (크기 내림차순, 넘으면 "+k more")
