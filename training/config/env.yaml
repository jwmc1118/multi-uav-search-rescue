# 환경 + 학습 공통 설정 — 맵 크기 · 장애물 · 조난자 · UAV · 관측 (env/role/simulation.py) 과 세 정책 공통 PPO / 병렬 수집
# 학습: python -m training.train   (env.yaml + role.yaml + explore.yaml + rescue.yaml 을 합쳐서 쓴다)
# 정책별 설정 (학습 / 규칙, 이벤트, 보상 weight, 네트워크) 은 role.yaml / explore.yaml / rescue.yaml
env: rescue_role
framework: torch

# ---- PPO (training/role/ppo.py: Role / Rescue / Explore 3 헤드, 헤드별 GAE · critic · ValueNorm) ----
gamma: 0.99                     # 할인율 — role SMDP 결정 구간 할인 γ^(t1 - t0) + bootstrap (rescue / explore 는 bandit, 할인 없음)
lambda: 0.95                    # GAE 계수
kl_coeff: 0.2                   # 이전 정책과의 KL 패널티 초기 계수 (헤드 공통, 자동 조절)
kl_target: 0.01                 # 목표 KL
clip_param: 0.2                 # PPO clip 범위
vf_clip_param: 10.0             # value clip — ValueNorm 정규화 공간(표준편차 1) 기준
vf_loss_coeff: 0.5              # critic loss 비중
grad_clip: 10.0                 # 전체 파라미터 gradient norm clip (MAPPO 기본, optimizer 파라미터 그룹 1 개 전체에 한 번)
entropy_coeff: 0.0              # (RLlib 용 자리, 실수만 허용) — 실제 헤드별 계수는 role.yaml / explore.yaml / rescue.yaml 의 entropy_coeff
lr: 3.0e-4                      # 학습률 (Adam) — 시작 값 (lr_schedule 이 있으면 그쪽이 매 iteration 덮어씀)
lr_schedule: [[0, 3.0e-4], [2000000, 5.0e-5]]   # [timestep, lr] 선형 보간, 이후 마지막 값 유지 (RLlib LearningRateSchedule)
train_batch_size: 4000          # 한 번 학습할 때 모으는 env step 수. 결정은 이벤트 때만이라 헤드별 유효 샘플은 이보다 훨씬 적다
                                # (규칙 정책 기준 role 결정 ≈ 0.5 / step). 학습 로그에 role 결정 < 200 / batch 경고가 뜨면 키울 것
rollout_fragment_length: 200    # 워커가 한 번에 수집하는 step 길이
sgd_minibatch_size: 500         # 미니배치 크기
num_sgd_iter: 5                 # 같은 배치 반복 학습 횟수
batch_mode: truncate_episodes   # fragment 단위로 잘라 수집 (끝은 critic 값으로 bootstrap)
observation_filter: NoFilter    # 관측 정규화 안 함 (env 에서 정규화)

# ---- 병렬 수집 ----
num_workers: 10                  # 데이터 수집 프로세스 수
num_envs_per_worker: 2          # 워커 하나가 동시에 돌리는 환경 수
num_gpus: 1                     # 학습에 쓰는 GPU 수 (0 = CPU, 없으면 train.py 가 자동으로 0)

# ---- 고정 seed 평가 (training/callbacks.py -> evaluation/fixed_seed_eval.py, train.py 가 읽고 RLlib 에는 넘기지 않음) ----
eval:
  every: 10                     # iteration 마다 학습과 별도로 평가 (driver policy, rollout 워커 영향 없음). 0 = 끔
  episodes: 15                  # 고정 seed 수 (run_rules 와 같은 seed 0 .. episodes-1), 세 head argmax 행동
                                #   best = eval 구조율 최대 (같으면 에피소드 길이가 짧은 쪽) -> checkpoints/best/
  greedy_baseline: 0.921        # reward_plot Eval 그래프 기준선 = 그리디 15 seed 구조율 (python -m evaluation.run_rules --episodes 15)

# ---- 네트워크 공통 (models/role/net.py) — 정책별 구조 · 크기는 role.yaml / explore.yaml / rescue.yaml 의 model ----
model:
  custom_model: role_model      # models/role/rllib_model.py
  custom_action_dist: role_multi_action   # training/role/action_dist.py
  custom_model_config:
    activation: relu            # 활성화 함수
    gnn:                        # 이종 그래프 GNN (models/role/gnn.py, 사양 env/role/graph_obs.py) — 세 네트워크가 같은 설정으로 각자 가짐
      embed_dim: 128            # 노드 임베딩 차원 D
      n_layers: 2               # 메시지 전달 층 수 L (층 · 관계 · 방향마다 파라미터 따로)
      knn_k: 6                  # S–S / K–K kNN 이웃 수 (k 번째와 거리가 같은 이웃은 모두 포함)
      s_max: 16                 # S (생존자) 노드 수 = rescue 행동 슬롯 수 (load_config 가 env_config.s_max 로 넣음)
      aggr: attention           # 관계별 이웃 집계: attention (multi-head, q = W_q h_v, k / v = W [h_u ‖ e_uv]) | mean_max (ablation)
      attn_heads: 4             # attention 집계 head 수 (embed_dim 을 나눠야 함)
    loss:                       # L = λ_role L_role + λ_exp L_exp + λ_res L_res (training/role/ppo.py)
      lambda_role: 1.0
      lambda_exp: 0.5
      lambda_res: 1.0
                                # 공유 encoder gradient norm 은 iteration 마다 1 회 측정 (EMA α 0.1, 최대/최소 10 배 이상 10 iteration 연속이면 경고)

env_config:
  # ---- 맵 / 조난자 ----
  map_mode: random              # random: 매 에피소드 장애물 맵을 새로 생성 / file: map_path 의 고정 맵
  map_path: maps/map_target/map_20260720_153619.json # 사용할 맵 — map_mode: file 일 때만
  rows: 40                      # random 맵 크기 (critic state 크기 때문에 학습 중 고정)
  cols: 60
  obstacle_ratio: [0.2, 0.3]    # random 맵 장애물 비율
  min_passage_width: 2          # random 맵 통로 최소 폭 (칸). 2 = 1 칸 틈 / 대각선 끼임 없이 생성, 1 = 제한 없음
  target_mode: random           # random: 매 에피소드 조난자 수/위치 새로 (depot 에서 도달 가능한 칸만)
  num_targets: [20, 50]         # 조난자 수 범위 (양끝 포함)
  target_golden_time: [100, 400]  # 조난자 골든타임 범위
  deadline_mode: from_start     # from_start: 에피소드 시작부터 / from_discovery: 발견 시점부터
  max_targets: 50               # critic 조난자 슬롯 수 (전체 조난자). num_targets 최댓값 이상
  max_episode_len: 400          # 에피소드 최대 길이 t_max. 시간 / 거리 특징의 정규화 분모
  d_max: null                   # 노드 특징 거리 정규화 분모 (최대 BFS 거리). null = rows + cols = 100 (40 x 60 맵)

  # ---- 연결성 (env/role/connectivity.py: C_pair = 연결된 쌍 비율 Σ_k n_k (n_k - 1) / (N (N - 1))) ----
  #   개인 연결도 c_{i,t} = (|comp_t(i)| - 1) / (N - 1) (팀 실제 위치) 를 rescue 보너스 (옵션 평균, rescue.yaml w_c) 와
  #   explore 연결 배율 (1 + w_mult c, explore.yaml w_mult) 에 쓴다. 쌍 비율 C_t 는 진단 로그 conn/real_mean 용 (보상 아님)
  rewards:
    connectivity:
      r_c_source: base          # base R_c (no hysteresis) — 간선 = 거리 <= 두 UAV 기본 통신 반경 중 작은 쪽

  # ---- 관측 ----
  state_size: 21                # local 창 크기 (홀수) — critic local 입력 / waypoint 창
  local_channels: [obstacle, agents]   # local 창 채널
                                # 추가 가능: frontier, explored, target  예) [obstacle, agents, frontier]
  global_downsample: 1          # critic 중앙 state 축소 배율
  n_hop: 4                      # 통신 hop 수. 그룹(지도 병합 · 순차 디코딩 · 공유 클러스터) 범위

  # ---- UAV ----
  position_mode: depot          # 모든 UAV 가 depot 에서 출발
  depot: null                   # depot = 모든 UAV 출발 / 재보충 지점, 월드 좌표 (x, y). null = random 맵이면 매 에피소드 랜덤
                                #   (학습은 null — main.py 는 env_main.yaml 의 고정 depot 을 쓴다)
  capacity: 3                   # UAV 한 대의 구호품 수. depot 에서 재보충
  agents:                       # UAV 별 센서 범위와 통신 범위
    - {sensor_range: 4, comm_range: 10}
    - {sensor_range: 4, comm_range: 10}
    - {sensor_range: 4, comm_range: 10}
    - {sensor_range: 4, comm_range: 10}
    - {sensor_range: 4, comm_range: 10}

  # ---- GUI (python main.py 로 띄울 때만 쓰임 — main.py 는 env_main.yaml 의 값을 읽는다) ----
  gui:
    cluster_info_max_rows: 8    # inspector Cluster info 에 보여 줄 덩어리 줄 수 (크기 내림차순, 넘으면 "+k more")

# ---- main.py / GUI 실행 설정 (main 전용 — 학습은 읽지 않음, main.py 는 env_main.yaml 의 값을 읽는다) ----
main:
  checkpoint: null              # 시작할 때 불러올 RolePPO 체크포인트 (checkpoint_XXXXXX 폴더 또는 그 안의 checkpoint-XX 파일).
                                #   null = 규칙 정책으로 시작 (GUI Model 버튼으로 나중에 불러와도 됨, M 키: model -> rules -> random)
                                #   예) marl_models/RolePPO/checkpoints/checkpoint_000200
                                #   환경 설정은 이 *_main.yaml 이 우선. 관측 차원 / 네트워크 구조가 다르면 어떤 키가 다른지 에러
  # checkpoint : marl_models/RolePPO/checkpoints/checkpoint_001000
  model_mode: greedy            # 모델 행동 선택: greedy (argmax) | sample (학습 때와 같은 확률 정책). 이동은 항상 BFS
  figures_dir: figures          # 임무 할당 분석 그래프 (Alloc Plots 버튼 / G 키) 저장 폴더 (레포 기준 상대 경로)
  auto_save_plots: false        # true 면 에피소드가 끝날 때마다 자동 저장
  inspector_width: 560          # 오른쪽 inspector 패널 폭 (px). 지도 셀 크기가 이 폭에 맞춰 정해진다
  font_size: 17                 # inspector 기준 글자 크기 (제목 = +4, legend / 본문 = 이 값) — gui/style.py BASE_FONT
  cell_size: 21                 # 메인 맵 셀 크기 (px). 21 이면 창 = 2500 x 1124 (2560 x 1440 모니터 기준 여유)
  speed_index: 2                # 자동 재생 초기 속도 (0 = 가장 느림 ~ 4 = 가장 빠름, GUI 버튼으로 바꿈)
  fps: 60                       # GUI 프레임 상한
