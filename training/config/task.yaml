# Task 정책 설정 — 역할을 고른 뒤의 하위 할당: 생존자 (RESCUE) / frontier 덩어리 (EXPLORE 1 단계) 선택 — 학습 / 규칙,
# task 네트워크 · critic · loss (models/role/net.py TaskNetwork, training/role/ppo.py task head), rescue 보상, frontier 할당
# (덩어리 · 1 단계 점수 · 2 단계 · explore 보상; env/role/explore.py, env/role/clusters.py, env/role/simulation.py)
# 학습: python -m training.train   (env.yaml + role.yaml + task.yaml)

# ==== 1) policy_mode (task) 와 task 네트워크 · 학습 설정 ====
# ---- 네트워크 (models/role/net.py): task 네트워크 (독립 encoder · GNN, env.yaml model.gnn 설정) — 1 단계만
#   노드 U (그룹 전체 — 역할 무관, 연결 + 메모리 노드) · S · F, 관계 S↔U, F↔U, U↔U, S↔S, F↔F, S↔F (U–S / U–F 간선 층마다 갱신)
#   pointer decoder, 후보 = S ∪ F (행동 = S 인덱스 / s_max + F 인덱스):
#     q_i = W_Q [h_i^L ‖ r_i ‖ ξ_ctx(c_i)] (r_i = 방금 고른 역할 one-hot, c_i = 그룹 context [ρ, η, ν, t / T_max]),
#     k_j = W_K [h_j^L ‖ e_ij^L] (j ∈ S: U–S 간선, j ∈ F: U–F 간선), u_ij = C tanh(q_iᵀ k_j / √D), π = softmax(u + M)
#   마스크 M: RESCUE -> 할당 가능 생존자만 (F 전부 차단, 같은 그룹 앞 차례가 고른 생존자 제외),
#             EXPLORE -> explore_mask 덩어리만 (S 전부 차단, 같은 덩어리 중복 선택 허용)
#   호출: role 에서 RESCUE 를 고르면 바로, EXPLORE 는 role 결정이 끝난 뒤 explore_front 차례로 (policies/decision_order.py)
#   2 단계 (같은 덩어리 안 구간 배정) 는 env 의 거리 합 최소 Hungarian (학습 없음)
model:
  custom_model_config:
    loss:
      lambda_task: 1.0          # L = λ_role L^role + λ_task (L^clip + c_v (L_V^res + L_V^exp) - c_e^res H^res - c_e^exp H^exp)
    task:
      clip: 10.0                # pointer 점수 tanh clip 상수 C
      entropy_coeff_rescue: 0.01    # RESCUE 표본 엔트로피 보너스 계수 c_e^res (RESCUE 표본에서만 계산)
      entropy_coeff_explore: 0.01   # EXPLORE 표본 엔트로피 보너스 계수 c_e^exp (EXPLORE 표본에서만 계산)
      value_norm: true          # 역할별 ValueNorm 2 개 (V^res, V^exp)
      critic:                     # task critic (CTDE rich critic, actor 와 인코더 비공유): 공유 trunk + value head 2 개
                                  #   (V^res, V^exp — 학습 표본은 고른 역할의 head 만). 입력 extra = [role_self, role_group] ‖
                                  #   고른 S 특징 (6) ‖ 고른 F 특징 (5)
        cnn_filters: [[16, 3, 2], [32, 3, 2], [64, 3, 1]]   # critic CNN 층 [채널, 커널, stride]
        state_features: 128       # critic 중앙 state CNN 출력 차원
        local_features: 64        # critic local CNN 출력 차원
        hidden: [128, 64]         # critic MLP 은닉층 (trunk, 마지막 선형층이 head 별)
        set_dim: 64               # critic 조난자 / 팀 집합 임베딩 차원
        set_heads: 4              # critic 조난자 attention 헤드 수


env_config:
  policy_mode: {task: rule}     # task head: learned = 학습 / rule = 규칙 (RESCUE: 주기 · 이벤트 "1" 담당 후보 / "2" "3" "4" EDF,
                                #   EXPLORE: 1 단계 점수 차례 + 2 단계 거리 Hungarian — policies/role_rules.py)
                                # ablation: (role, task) = (rule, rule) / (learned, rule) / (learned, learned)

  # ==== 2) 생존자 할당 (rescue) 보상 (env/role/simulation.py _rescue_event_reward / _option_bonus — 개인 + 그룹 F, 옵션 단위, 할인 없음) ====
  #   r_i = (n_suc_i - F_excess) / N_T + r_dup_i + bonus_i
  #   G_res = 이번 이벤트에서 RESCUE 를 고른 같은 그룹 UAV (같은 생존자 유지 포함, F 계산), σ_u = τ_u - t - min_{l ∈ G_res} BFS(l, u)
  #   보상 ((n_suc_i - F_excess) / N_T, 새 옵션, 중복) 은 그중 새 표본 (다른 생존자 / 새로 RESCUE) 에만 — 같은 생존자를 다시 고르면
  #   옵션이 이어진다
  #   n_suc_i ∈ {0, 1} = UAV i 가 고른 생존자에 시간 안에 닿음 (개인)
  #   U_ε = 급한 생존자: 그룹이 아는 생존자 중 G_res 밖의 UAV (다른 그룹 포함) 가 맡지 않았고 0 <= σ_u <= ε,
  #   F = U_ε 중 G_res 가 할당하지 않은 수, F_excess = F - F_min, F_min = max(0, |U_ε| - |G_res|) (피할 수 없는 급한 생존자 누락)
  #     — G_res 전원 같은 값
  #   r_dup_i = -w_dup · 1[같은 생존자를 더 가까운 다른 UAV 가 쫓음] (결정당 1 회)
  #   bonus_i = w_b · 1[옵션이 i 의 구조 완료로 끝남] · 1[F_excess = 0] · ((1 - w_c) e^{-d_i} + w_c ω̄^g_i) / N_T  (옵션 끝 step 에 1 회,
  #     목표 / 역할 변경 · 이벤트 "4" · 에피소드 끝으로 끝난 옵션은 0), d_i = BFS(i, a_i) / d_max (결정 시점),
  #     ω̄^g_i = 옵션 동안 그룹 연결도 ω^g_{i,t} = (|U_{i,t}| - 1) / (|U| - 1) 평균 (U_{i,t} = belief 를 병합하는 i 의 통신 그룹,
  #     n-hop · comm hysteresis 포함 — UAV 노드 특징 omega_group 과 같은 값)
  #   학습: 옵션 단위 R_i (t1 에 확정, bootstrap 없음), A = R_i - V
  rewards:
    rescue:
      epsilon_urgent: 5   # 급한 생존자: 그룹 slack σ = τ − t − min_{G_res} BFS 가 0 ≤ σ ≤ 이 값
      w_b: 1.0   # 구조 성공 보너스 가중치 (/ N_T)
      w_c: 0.5   # 보너스 안의 거리 / 연결도 비중: (1 − w_c) e^{−d_i} + w_c · ω̄^g_i
      w_dup: 0.05   # 중복 추적 penalty
    # ==== 3) frontier 할당 (explore): 덩어리 (DBSCAN) -> 1 단계 덩어리 선택 (점수 차례) -> 같은 덩어리 m 대면 구간 분할 · 2 단계 배정, explore 보상 ====
    #   2 단계 (같은 덩어리 안 구간 배정) 는 거리 합 최소 1:1 Hungarian (학습 없음): 비용 = UAV 에서 구간 셀까지 BFS 최소 거리
    #     (기존 goal 우대 없음, 도달 불가 1e6)
    #   덩어리 쪼개짐 / 합쳐짐: 재결정 없이 소속만 이어 붙임 (쪼개짐 = 내 구간이 가장 많이 남은 조각, 합쳐짐 = 새 덩어리)
    #   이번 step 누군가 고른 덩어리: 고른 UAV + 기존 배정자 전원을 Hungarian 으로 다시 구간 배정 (기존 배정자의 explore
    #     옵션은 계속). 아무도 새로 고르지 않은 덩어리의 기존 배정자는 그대로
    #   (YAML 구조상 explore 보상은 rewards 안에 있어야 하므로 이 섹션의 보상을 먼저, 덩어리 · 1 단계 · 2 단계 설정은 그 뒤)
    # ---- explore 보상 (env/role/simulation.py role_rewards / explore_cells): 개인, 자기 belief 기준 ----
    #   r = (1 + w_omega · ω^g_{i,t}) · r_direct + r_share  (EXPLORE 인 step 만, 그룹 연결도 배율은 직접 탐색 항에만)
    #   r_direct = (1 / |C_free|) Σ_{c ∈ V_{i,t} \ C_found,i,t-1, c free} 1 / n_c
    #   r_share  = w_share · |ΔC^merge_{i,t}| / |C_free|
    #   V_{i,t} = 이번 step i 가 직접 본 셀, C_found,i,t-1 = 직전 step 까지 i 의 (그룹 병합) belief 에서 알려진 free 셀,
    #   n_c = 같은 통신 그룹 안에서 이번 step c 를 직접 본 UAV 수 (그룹 안에서만 나눔),
    #   ΔC^merge = 이번 step 통신 병합으로 i 의 belief 에 처음 들어온 free 셀 (i 의 그룹이 직접 본 셀 제외, UAV 당 한 번)
    #   학습: 옵션 단위 할인 누적 R = Σ_{t0 <= t < t1} γ^(t - t0) r (t1 = 다음 explore 결정 / 역할 변경 / 에피소드 끝,
    #   재결정에서 같은 덩어리를 다시 고르면 옵션이 이어짐), bootstrap 없음, A = R - V (γ = env.yaml 최상위 gamma)
    explore:
      w_share: 0.5  # 정보 공유: 통신 병합으로 처음 알게 된 free 셀 가중치 (직접 탐색 셀 = 1)
      w_omega: 0.3  # 직접 탐색 항의 그룹 연결도 배율 (1 + w_omega · ω^g)

  # ---- 덩어리 (frontier DBSCAN, env/role/clusters.py) ----
  cluster:
    eps: 1.5                    # DBSCAN 이웃 반경 (유클리드). 1.5 = 8-연결
    min_samples: 2               # core 셀 조건: 자기 포함 이웃 frontier 수 (미만이고 core 이웃도 아니면 noise 로 버림)
    k_max: 10                   # F 노드 (덩어리) 슬롯 수 (크기 내림차순 상위)

  # ---- 1 단계 점수 · 2 단계 (env/role/explore.py): 덩어리 선택 -> 같은 덩어리 m 대면 측지 k-medoids 로 구간 분할 -> 구간 배정 ----
  explore:
    n_sub_max: 5                # 2 단계 구간 슬롯 수 = 한 덩어리를 나누는 구간 수 상한 (넘는 담당자는 구간 공유). 기본 = UAV 수
    size_ref: 100               # 덩어리 / 구간 크기 특징 정규화: min(1, log(1+|C|) / log(1+size_ref)). GNN F 노드 · critic 공통
    match_dilate: 1             # step 간 덩어리 대응: 이전 덩어리 셀을 이 칸만큼 넓혀 겹침 판정 (frontier 1 칸 후퇴 흡수)
    track_margin: 2             # 소속 덩어리가 사라졌을 때 직전 구간 셀에서 (센서 범위 + 이 값) 이내의 새 덩어리로 이어 붙임
    kmedoids_iters: 10          # 구간 분할 k-medoids 반복 상한
                                # 매 step 구간 rebalance (정책 호출 없음): 담당자 m >= 2 인 덩어리를 현재 frontier 전체로
                                #   k = min(m, |C|) k-medoids 재분할 (각자의 goal 셀 근처로 warm start), 매칭 비용 = goal 이 든
                                #   구간 0 / 아니면 위치에서 구간까지 BFS. 이동 목표점 = 내 구간 frontier 중 BFS 가장 가까운 셀
    order_dist_alpha: 2.0       # 1 단계 차례 (policies/decision_order.py explore_front, env · 그리디 · 학습 모델 공통):
                                #   남은 UAV j x 닿는 덩어리 m 의 모든 쌍 중 점수 (N_m / (n_m + 1)) / (d_jm + 1)^α 최대 쌍이 다음 차례
                                #   (N = 덩어리 크기, n = 배정 수, d = BFS 칸 수, 한 대마다 n 갱신). 모델 config 로 자동 복사
