# main.py 전용 설정 (학습은 explore.yaml 을 사용)
# Explore 정책 설정 — 2 단계 할당 (덩어리 선택 -> 같은 덩어리 m 대면 구간 분할 -> 구간 선택): 학습 / 규칙,
# 덩어리 (DBSCAN) · 구간 (k-medoids) 파라미터, explore 보상, 네트워크
# (env/role/explore.py, env/role/clusters.py, policies/role_rules.py rule_explore / rule_explore_sub, models/role/net.py)
# 학습: python -m training.train   (env.yaml + role.yaml + explore.yaml + rescue.yaml)
env_config:
  policy_mode: {explore: learned}   # Explore 헤드: learned = 학습 / rule = 그리디 (1 단계 share_rr, 2 단계 κ Hungarian)
  # explore 2 단계 (같은 덩어리 안 구간 배정) 는 항상 κ 합 최소 1:1 Hungarian (학습 없음, explore_sub_mode 옵션 제거)
  # 덩어리 쪼개짐 / 합쳐짐: 재결정 없이 소속만 이어 붙임 (쪼개짐 = 내 구간이 가장 많이 남은 조각, 합쳐짐 = 새 덩어리)
  # 이번 step 누군가 고른 덩어리: 고른 UAV + 기존 배정자 전원을 Hungarian 으로 다시 구간 배정 (기존 배정자의 explore
  #   옵션은 계속). 아무도 새로 고르지 않은 덩어리의 기존 배정자는 그대로

  # ---- explore 클러스터 (frontier DBSCAN, env/role/clusters.py) ----
  cluster:
    eps: 1.5                    # DBSCAN 이웃 반경 (유클리드). 1.5 = 8-연결
    min_samples: 2               # core 셀 조건: 자기 포함 이웃 frontier 수 (미만이고 core 이웃도 아니면 noise 로 버림)
    k_max: 10                   # explore 노드 슬롯 수 (크기 내림차순 상위)

  # ---- explore 2 단계 (env/role/explore.py): 덩어리 선택 -> 같은 덩어리 m 대면 측지 k-medoids 로 구간 분할 -> 구간 선택 ----
  explore:
    n_sub_max: 5                # 2 단계 구간 슬롯 수 = 한 덩어리를 나누는 구간 수 상한 (넘는 담당자는 구간 공유). 기본 = UAV 수
    size_ref: 100               # 덩어리 / 구간 크기 특징 정규화: min(1, log(1+|C|) / log(1+size_ref)). GNN K 노드 · critic · g_exp 공통
    match_dilate: 1             # step 간 덩어리 대응: 이전 덩어리 셀을 이 칸만큼 넓혀 겹침 판정 (frontier 1 칸 후퇴 흡수)
    track_margin: 2             # 소속 덩어리가 사라졌을 때 직전 구간 셀에서 (센서 범위 + 이 값) 이내의 새 덩어리로 이어 붙임
    kmedoids_iters: 10          # 구간 분할 k-medoids 반복 상한
                                # 매 step 구간 rebalance (정책 호출 없음): 담당자 m >= 2 인 덩어리를 현재 frontier 전체로
                                #   k = min(m, |C|) k-medoids 재분할 (각자의 goal 셀 근처로 warm start), 매칭 비용 = goal 이 든
                                #   구간 0 / 아니면 위치에서 구간까지 BFS
    goal_mode: nearest          # 이동 목표점: nearest = 내 구간 frontier 중 BFS 가장 가까운 셀 (관측되면 다음 가까운 셀) / medoid = 구간 medoid

  # ---- 보상 (env/role/simulation.py role_rewards): 매 step 내 기여 커버리지 x 연결 배율 ----
  #   r = (1 - ψ^f) Δcov^(i) / |free| · (1 + w_mult c_{i,t})  (EXPLORE 인 step 만), ψ^f = 팀 전체 발견 생존자 수 / N_T,
  #   c_{i,t} = (|comp_t(i)| - 1) / (N - 1) 개인 연결도 (실제 위치, 간선 = 거리 <= 기본 R_c),
  #   Δcov^(i) = 팀 전역에서 이번 step 처음 관측된 free 셀 중 i 가 본 것 (같은 step 에 k 대가 보면 1/k 씩)
  #   학습: 옵션 단위 할인 누적 R = Σ_{t0 <= t < t1} γ^(t - t0) r (t1 = 다음 explore 결정 / 역할 변경 / 에피소드 끝),
  #   bootstrap 없음, A = R - V (γ = env.yaml 최상위 gamma)
  rewards:
    explore:
      w_mult: 0.2   # 연결 배율: 새 셀을 밝힐 때만 (1 + w_mult·c) 배

# ---- 네트워크 (models/role/net.py): frontier 할당 네트워크 (독립 encoder · GNN, env.yaml model.gnn 설정) — 1 단계만
#   노드 U (그룹의 EXPLORE UAV) · K (덩어리 슬롯), 관계 K→U, U→K, U→U, K→K (kNN), attention 집계
#   CapAM decoder: query = W_c [h_i^L ‖ t / T], 후보 F_j = Linear([h_{k_j}^L ‖ e_ij]), 마스크 = explore_mask (중복 선택 허용)
model:
  custom_model_config:
    explore:
      n_heads: 8                # CapAM decoder MHA 헤드 수 (glimpse)
      clip: 10.0                # pointer 점수 tanh clip 상수 C
      entropy_coeff: 0.01       # 이 헤드 엔트로피 보너스 계수
      value_norm: true          # 이 헤드 critic ValueNorm (MAPPO)
      critic:                     # explore 헤드 critic (CTDE rich critic, actor 와 인코더 비공유)
        cnn_filters: [[16, 3, 2], [32, 3, 2], [64, 3, 1]]   # critic CNN 층 [채널, 커널, stride]
        state_features: 128       # critic 중앙 state CNN 출력 차원
        local_features: 64        # critic local CNN 출력 차원
        hidden: [128, 64]         # critic MLP 은닉층
        set_dim: 64               # critic 조난자 / 팀 집합 임베딩 차원
        set_heads: 4              # critic 조난자 attention 헤드 수
