# main_scale.py 설정 — UAV 수 N 과 함께 조난자 수 · 맵 크기 · 시간을 키워가며 규칙 정책 vs 학습 체크포인트 비교 (N 마다 같은 seed)
# 실행: python main_scale.py --checkpoint <checkpoint_XXXXXX 폴더 또는 파일> [--n 2,4,8] [--seeds 0-49] [--preset fixed] [--tag name]
# 환경 설정 병합 순서: 체크포인트 params.json 의 env_config -> env.files -> env.overrides -> N 별 크기 조정 (presets)
#   크기 조정 후에도 체크포인트 값으로 고정: state_size, local_channels, global_downsample, s_max, cluster.k_max, explore.n_sub_max
#   (학습 슬롯 수 유지 -> 넘치는 생존자 / 덩어리는 잘림, per_episode 의 trunc_* / dropped_* 로 기록)
#   입력 정규화는 새 맵 기준: d_max = rows + cols (env_config.d_max 를 null 로), 시간 = 새 max_episode_len
#   조난자 슬롯 max_targets = max(체크포인트 값, 조정된 조난자 수 상한) (모델 파라미터와 무관)
# 결과: results/scale_evaluation/<YYYYMMDD_HHMMSS>_<tag>/  scale.csv, per_episode.csv, scale_table.tex,
#       figures/*.pdf|png|csv, meta.json (N 별 실제 env_config · 체크포인트 · git commit)

checkpoint: null                # 학습 체크포인트 (CLI --checkpoint 가 우선). 레포 기준 상대 경로 또는 절대 경로
n_list: [2, 3, 4, 5, 6, 8, 10]  # UAV 수 목록 (CLI --n '2,4,8')
n_ref: null                     # 기준 UAV 수 N_ref (null = 체크포인트 UAV 수). 크기 조정 비율 r = N / N_ref
seeds: "0-49"                   # N 마다 같은 seed 목록 — 같은 (seed, N) 에서 두 정책의 초기 상태가 같다 (N 이 다르면 맵도 다름)
mode: greedy                    # 학습 모델 행동 선택: greedy | sample
tag: scale                      # 결과 폴더 이름 꼬리 (preset 이름이 뒤에 붙음)
workers: null                   # 병렬 워커 수 ((N, seed) 단위, CPU, torch 스레드 1). null = CPU 코어 수 - 2 (최소 1). CLI --workers

preset: default                 # 아래 presets 중 하나 (CLI --preset)
presets:                        # 항목별 지수 e: 값 <- round(값 x r^e), null = 체크포인트 값 고정
  default:
    survivors: 1.0              # num_targets (int 또는 [min, max]) ∝ N / N_ref
    map: 0.5                    # rows, cols ∝ √(N / N_ref) (UAV 당 면적 일정)
    golden_time: 0.5            # target_golden_time ([min, max]) ∝ √(N / N_ref) (맵 한 변 길이에 비례)
    max_episode_len: 0.5        # max_episode_len ∝ √(N / N_ref)
  fixed:                        # UAV 수만 바뀜
    survivors: null
    map: null
    golden_time: null
    max_episode_len: null
# 항상 고정 (체크포인트 값): obstacle_ratio, 센서 / 통신 범위 (첫 UAV 값 복제), capacity, n_hop, 그 밖의 env 설정

env:
  files: []                     # 체크포인트 env_config 위에 차례로 덮을 yaml 파일 (그 파일의 env_config)
  overrides: {}                 # 그 위에 덮을 env_config 값 (크기 조정 전 기준값)

metrics:                        # 에피소드 끝 지표 (eval_common/episode.py run_episode_detailed) — 표 / 요약 순서
  - rescue_rate
  - expire_rate
  - discover_rate
  - explored
  - episode_len
  - rescue_time_mean
  - golden_slack_mean
  - rescued_per_uav
  - same_cell
  - conflict_cross
  - escalations
  # 슬롯 잘림 (eval_common/episode.py slot_snapshot — S = 역할 결정, K = explore 1 단계 결정 기준)
  - trunc_decisions_S           # 할당 가능 후보 수 > s_max 인 결정 수
  - trunc_frac_S                # 그 결정 비율
  - dropped_S                   # 잘린 할당 가능 후보 수 합 (= dropped_reachable_S: 후보 조건이 골든타임 안 도달)
  - dropped_S_per_dec           # 결정당 잘린 후보 수
  - dropped_urgent_S            # 잘린 후보 중 남은 후보의 최소 slack 보다 급한 후보 수 합
  - best_dropped_S              # EDF 로 고를 생존자가 잘린 쪽에 있던 결정 수
  - trunc_decisions_K           # 덩어리 수 > k_max 인 1 단계 결정 수
  - trunc_frac_K
  - dropped_K                   # 잘린 덩어리 수 합
  - dropped_K_cells             # 잘린 덩어리 frontier 셀 수 합
  - s_nodes_overflow            # (예전 survivor_truncated) 그룹이 아는 미구조 생존자 전체 > s_max 인 역할 결정 수 (S 노드 넘침)
  # 확장성 진단 (eval_common/episode.py run_episode_detailed)
  - ub_loose                    # 이론적 상한: depot 에서 골든타임 안에 도달 가능한 조난자 비율 (rule_evaluation/upper_bound.py)
  - ub_greedy                   # 전지적 EDF 스케줄 구조 비율 (참고)
  - rescue_over_ub              # 구조율 / ub_loose
  - group_size_mean             # 통신 그룹 평균 크기 (step 평균)
  - n_groups_mean               # 통신 그룹 수 (step 평균)
  - isolated_frac               # 혼자인 UAV 비율 (step 평균)
  - expire_undiscovered_rate    # 만료 원인 (N_T 대비): 미발견 상태로 만료
  - expire_unassigned_rate      #   발견했지만 아무도 맡지 않은 채 만료
  - expire_assigned_rate        #   RESCUE UAV 가 맡고 있던 중 만료
lower_is_better: [expire_rate, episode_len, rescue_time_mean, same_cell, conflict_cross, escalations,
                  trunc_decisions_S, trunc_frac_S, dropped_S, dropped_S_per_dec, dropped_urgent_S, best_dropped_S,
                  trunc_decisions_K, trunc_frac_K, dropped_K, dropped_K_cells, s_nodes_overflow, isolated_frac,
                  expire_undiscovered_rate, expire_unassigned_rate, expire_assigned_rate]
                  # 나머지는 클수록 좋음. 추론 시간 (infer_ms_per_decision) 은 모델만 따로 요약

bootstrap:
  n: 10000                      # 95% CI bootstrap 횟수
  seed: 0                       # bootstrap 난수 seed (재현)
  alpha: 0.05                   # 1 - 신뢰수준

figures:
  enabled: true                 # 그림 저장 (--no-figs 로 끔)
  width: double                 # 여러 패널 그림 폭: single (3.5 in) | double (7.16 in)
  dpi: 300                      # PNG 해상도 (PDF 는 벡터)
