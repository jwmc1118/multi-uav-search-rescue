# main_gui.py 전용 설정 (학습은 training/config/env.yaml 을 사용). env_gui.yaml + role_gui.yaml + task_gui.yaml 을 합쳐서 읽는다
# GUI 가 쓰는 것만 둔다: 네트워크 공통 (model — 체크포인트와 구조 비교), 환경 (env_config), GUI 화면 설정 (main).
# 학습 전용 (PPO · 병렬 수집 · 고정 seed 평가 · 학습 그래프) 은 두지 않는다. 같은 키는 training/config 와 같은 값으로 유지
# (tests/role/test_config.py — depot · GUI 설정만 예외)

# ---- 네트워크 공통 (models/role/net.py) — 네트워크별 설정은 role.yaml / task.yaml 의 model ----
model:
  custom_model: role_model      # models/role/rllib_model.py
  custom_action_dist: role_multi_action   # training/role/action_dist.py
  custom_model_config:
    activation: relu            # 활성화 함수
    gnn:                        # 이종 그래프 GNN (models/role/gnn.py, 사양 env/role/graph_obs.py) — 세 네트워크 (role / rescue / explore) 가 같은 설정으로 각자 가짐
      embed_dim: 128            # 노드 임베딩 차원 D
      n_layers: 2               # 메시지 전달 층 수 L (층 · 관계 · 방향마다 파라미터 따로)
      knn_k: 6                  # S–S / F–F / S–F kNN 이웃 수 (k 번째와 거리가 같은 이웃은 모두 포함)
      s_max: 16                 # S (생존자) 노드 수 = 할당 행동의 생존자 슬롯 수 (load_config 가 env_config.s_max 로 넣음)
      attn_heads: 4             # 관계별 이웃 집계 multi-head attention (q = W_q h_v, k / v = W [h_u ‖ e_uv]) 의 head 수 (embed_dim 을 나눠야 함)
                                # loss 가중치 λ_role / λ_rescue / λ_explore 는 role.yaml / task.yaml

env_config:
  # ---- 맵 / 조난자 ----
  map_mode: random              # random: 매 에피소드 장애물 맵을 새로 생성 / file: map_path 의 고정 맵
  map_path: maps/map_target/map1.json # 사용할 맵 — map_mode: file 일 때만
  rows: 40                      # random 맵 크기 (critic state 크기 때문에 학습 중 고정)
  cols: 60
  obstacle_ratio: [0.1, 0.3]    # random 맵 장애물 비율
  min_passage_width: 2          # random 맵 통로 최소 폭 (칸). 2 = 1 칸 틈 / 대각선 끼임 없이 생성, 1 = 제한 없음
  target_mode: random           # random: 매 에피소드 조난자 수/위치 새로 (depot 에서 도달 가능한 칸만)
  num_targets: [20, 50]         # 조난자 수 범위 (양끝 포함)
  target_golden_time: [125, 400]  # 조난자 골든타임 범위 (마감 = 에피소드 시작 기준)
  max_targets: 50               # critic 조난자 슬롯 수 (전체 조난자). num_targets 최댓값 이상
  max_episode_len: 400          # 에피소드 최대 길이 t_max. 시간 / 거리 특징의 정규화 분모
  d_max: null                   # 노드 특징 거리 정규화 분모 (최대 BFS 거리). null = rows + cols = 100 (40 x 60 맵)

  # ---- 관측 ----
  state_size: 21                # local 창 크기 (홀수) — critic local 입력 / waypoint 창
  local_channels: [obstacle, agents]   # local 창 채널
                                # 추가 가능: frontier, explored, target  예) [obstacle, agents, frontier]
  global_downsample: 1          # critic 중앙 state 축소 배율
  n_hop: 4                      # 통신 hop 수. 그룹(지도 병합 · 순차 디코딩 · 공유 클러스터) 범위
  memory:                       # 메모리 노드 (env/role/simulation.py _memory_update): UAV 마다 다른 UAV 의 마지막 기록 (위치, 용량,
                                #   역할, 목표, depot 거리, ω^g, t_last). 매 step 현재 그룹 멤버는 지금 상태로, 그룹 밖 UAV 는 멤버들의
                                #   기록 중 가장 최근 것을 공유 (중계). 그래프 U 노드 = 현재 그룹 + 그룹 밖 기록 (GNN 입력 전용 —
                                #   마스크 · 결정 순서 · ω^g · 보상 · 이벤트에는 안 씀, 위치 추정 없음)
    enabled: true               # false = 현재 그룹만 U 노드
    T_age: 50                   # 메모리 노드 age = min(1, (t - t_last) / T_age)

  # ---- UAV ----
  position_mode: depot          # 모든 UAV 가 depot 에서 출발
  depot: [-30, -19]             # depot = 모든 UAV 출발 / 재보충 지점, 월드 좌표 (x, y) (x 오른쪽 +, y 위쪽 +, 원점 = 맵 중앙)
                                #   40 x 60 맵: x -30 ~ 29, y -19 ~ 20 -> (-30, -19) = 왼쪽 아래 구석. null = random 맵이면 매번 랜덤
  capacity: 3                   # UAV 한 대의 구호품 수. depot 에서 재보충
  agents:                       # UAV 별 센서 범위와 통신 범위
    - {sensor_range: 5, comm_range: 10}
    - {sensor_range: 5, comm_range: 10}
    - {sensor_range: 5, comm_range: 10}
    - {sensor_range: 5, comm_range: 10}
    - {sensor_range: 5, comm_range: 10}

  # ---- GUI (python main_gui.py 로 띄울 때만 쓰임 — main_gui.py 는 env_gui.yaml 의 값을 읽는다) ----
  gui:
    cluster_info_max_rows: 8    # inspector Cluster info 에 보여 줄 덩어리 줄 수 (크기 내림차순, 넘으면 "+k more")

# ---- main_gui.py / GUI 화면 설정 · 시작 조합 (학습은 읽지 않음). 정책 · 모델은 GUI 의 Model 창에서도 바꿈 ----
main:
  # 시작 조합 (main_gui.py CLI 가 우선) — Model 창의 Source -> 조합 / Run 과 같은 선택
  source: saved                 # saved (marl_models/best_model) | training (marl_models/ 아래 run)
  combo: rule_rule_rule         # saved: best_model 아래 조합 폴더 <role>_<rescue>_<explore> (rule_rule_rule = 모델 없이 규칙 정책)
  model: null                   # saved 모델 버전 (예: model_v03). null = 그 폴더의 최신 버전
  run: null                     # training: run 폴더 이름 (예: learn_learn_rule_20261104_220048)
  checkpoint: null              # training: best | checkpoint_000420. null = best (없으면 최신)
  model_mode: greedy            # 모델 행동 선택: greedy (argmax) | sample (학습 때와 같은 확률 정책). 이동은 항상 BFS
  figures_dir: results/gui_evaluation   # 임무 할당 분석 그래프 (Assign Plots 버튼 / G 키) 저장 폴더 (레포 기준 상대 경로)
  auto_save_plots: false        # true 면 에피소드가 끝날 때마다 자동 저장
  inspector_width: 560          # 오른쪽 inspector 패널 폭 (px). 지도 셀 크기가 이 폭에 맞춰 정해진다
  font_size: 17                 # inspector 기준 글자 크기 (제목 = +4, legend / 본문 = 이 값) — gui/style.py BASE_FONT
  cell_size: 21                 # 메인 맵 셀 크기 (px). 21 이면 창 = 2500 x 1124 (2560 x 1440 모니터 기준 여유)
  speed_index: 2                # 자동 재생 초기 속도 (0 = 가장 느림 ~ 4 = 가장 빠름, GUI 버튼으로 바꿈)
  fps: 60                       # GUI 프레임 상한
