# main_gui.py 전용 설정 (학습은 role.yaml 을 사용)
# Role 정책 설정 — 역할 선택 (EXPLORE / RESCUE / RETURN): 학습 / 규칙, 역할 결정 · Role 이벤트, role 보상 weight, 네트워크
# (env/role/simulation.py, policies/role_rules.py rule_role, models/role/net.py 역할 선택 네트워크)
# 학습: python -m training.train   (env.yaml + role.yaml + task.yaml)
env_config:
  # ---- 역할 결정 ----
  role:
    max_redecide: 1             # 하위 할당 실패(고를 노드 없음) 시 RETURN 으로 대체하는 횟수 상한 (점검용 —
                                #   역할 마스크가 남은 생존자 / 덩어리를 미리 반영하므로 정상이면 실패 없음)
    return_min_deficit: 1       # 부분 귀환 (용량이 남아도 RETURN) 허용 최소 부족분 (cap_max - cap). 충전 직후 RETURN 은 자동으로
                                #   막힘 (반복 귀환 방지). 역할 마스크: cap 0 -> RETURN, EXPLORE / 0 < cap < cap_max 이고
                                #   부족분 >= return_min_deficit -> RESCUE, EXPLORE, RETURN / 그 외 (cap_max 포함) -> RESCUE, EXPLORE
                                #   (그룹 belief 발견 수 = N_T 면 EXPLORE 제외, 전부 막히면 RETURN)

  # ---- 그리디 정책 (policies/role_rules.py RuleDecider, run_rules · main rules 모드 · rule 헤드) ----
  #   role + rescue (주기 · 이벤트 "1", 그룹): 차례 (급한 생존자에 가장 가까운 UAV) 의 담당 후보 생존자 -> RESCUE,
  #     없으면 EXPLORE (용량 0 RETURN)
  #   role + rescue (이벤트 "2" / "3" / "4", 한 대): 용량 0 RETURN, 할당 가능 생존자 있음 -> RESCUE (여유 시간 τ - t - d 최소 -> 생존자 번호), 없으면 EXPLORE
  #   explore 1 단계: 담당 후보 덩어리 (아래 1 단계 차례), 담당 후보가 없으면 같은 점수 최대 덩어리.
  #     2 단계: 참여자 전원 1:1 Hungarian (구간까지 BFS 거리 합 최소, goal 우대 없음)

  # ---- 이벤트 (env/role/simulation.py) ----
  # Role 재결정 — 대상 UAV 만 역할부터 다시 결정하고 하위 할당 (생존자 / 덩어리 + 구간 / depot) 까지 다시, 나머지는 유지:
  #   periodic: t % period == 0 (t = 0 포함) 이면 alive UAV 전원 (RETURN · 용량 0 포함). 이벤트와 독립 (시계 리셋 없음)
  #   "1" 생존자 증가 (그 그룹 전원 — 멤버별 직전 belief 와 비교, 통신 병합으로 알게 된 생존자 포함) / "2" 구조 완료 (그 UAV) /
  #   "3" Return 완료 (그 UAV) / "4" 목표 무효 (그 UAV)
  #   ("4" 에는 exploration complete 포함: 그룹 belief 발견 수가 N_T 에 처음 도달하면 그 그룹 EXPLORE UAV 전원.
  #    이후 그 그룹은 역할 마스크에서 EXPLORE 금지 — 그리디는 할당 가능 생존자 -> RESCUE, 없으면 RETURN)
  #   목표 유효 (관측 goal_valid): "2" / "3" / "4" 면 꺼짐, periodic · "1" 은 유지 (기존 목표가 관측에 그대로)
  #   RESCUE 재결정: 자기 현재 목표도 후보 (재결정하지 않는 UAV 가 맡은 생존자만 막음). EXPLORE 재결정: 지금 덩어리도 후보
  #   같은 생존자 / 덩어리를 다시 고르면 새 학습 표본이 아님
  # 결정 순서 (policies/decision_order.py, 그리디 / 학습 공통, 한 대가 결정할 때마다 남은 대상으로 다시 계산):
  #   role 차례 = 여유 시간 σ 가 작은 생존자부터 가장 가까운 UAV (닿는 UAV 가 없으면 가까운 생존자 거리 -> 용량 -> 번호),
  #   RESCUE 를 고르면 바로 생존자 할당 (다음 role 차례는 그 선택을 반영해 다시 계산),
  #   1 단계 차례 = 남은 UAV x 닿는 덩어리 쌍 중 점수 (N_m / (n_m + 1)) / (d + 1)^α 최대 쌍 (task.yaml explore.order_dist_alpha,
  #     동률: 큰 덩어리 -> 슬롯 -> 거리 -> 번호, 한 대마다 n 갱신),
  #   2 단계 = 그 덩어리를 고른 UAV + 기존 배정자를 거리 합 최소 Hungarian 으로 구간 배정 (env, 학습 없음)
  # 덩어리 쪼개짐 / 합쳐짐은 재결정 없이 소속만 이어 붙인다
  events:
    goal_latch_outside_steps: 3 # explore 목표 셀 유지 (goal latch): 관측되어 frontier 가 아님 / 도달 불가 / 내 구간 밖에 이만큼
                                #   연속일 때만 변경
    no_segment_steps: 3         # rebalance 후 내 구간이 없는 상태가 이만큼 연속이면 이벤트 "4" (목표 무효)
    comm_hysteresis: 2          # 통신 링크: 생성 거리 <= R_c, 해제 거리 > R_c + 이 값 (그룹 / belief / 보상 / 특징 공통, 0 = 끔)
    log_events: true            # 이벤트 / 역할 전환 / 목표 변경 기록 (info event_stats, custom_metrics)
    log_dir: null               # 에피소드 로그 JSON 폴더 (null = 저장 안 함. run_rules 는 results/rules/event_logs/<tag>)
    period: 10                  # 주기 재결정 간격 (step, >= 1): t % period == 0 (t = 0 포함) 이면 alive UAV 전원

  # ---- 보상 (env/role/simulation.py role_rewards, training/role/ppo.py 결정 단위 SMDP) ----
  #   r_role_{i,t} = (|ΔR_t| - w_x |ΔE_t|) / N_T + (w_d / N_T) · Σ_{k ∈ ΔF_t} 1[τ_k - t > T_m]
  #                  - (w_sw / N_T) · 1[i 가 step t 에 자발적 역할 전환]
  #     (앞 두 항은 팀 공통, step 갱신 후 상태로 계산. 전환 penalty 는 개인, 전환을 결정한 step 의 보상 = 그 결정 구간의 return)
  #   늦지 않은 발견 보상: 발견 시점에 골든타임이 T_m step 넘게 남은 생존자를 처음 발견하면 +w_d / N_T (팀 공통)
  #     ΔF_t = step t 에 팀 전체 기준으로 처음 발견된 생존자 (실제 값), τ_k = 골든타임 마감, t = step 갱신 후 시각.
  #     이미 만료된 생존자는 자동 제외, 이후 구조 · 만료 시 회수 없음
  #   자발적 전환 = 재결정 원인이 periodic / "1" 뿐 ("2" / "3" / "4" 가 함께 있으면 아님) · 이전 역할이 이번 role_mask 에서
  #     허용 · 새 역할 != 이전 역할 (역할이 같고 목표만 바뀌면 아님, t = 0 첫 배정 아님). 나머지 전환은 강제 (penalty 없음)
  #   결정 t0 ~ 다음 role 결정 t1 의 γ_r 할인 누적 + γ_r^(t1 - t0) V(s_t1) 로 bootstrap (γ_r = env.yaml 최상위 role_gamma)
  rewards:
    role:
      w_x: 2.0                  # 만료 1 명당 (팀 공유, / N_T)
      terminal_unrescued_as_expired: true   # 에피소드가 끝날 때 아직 구조되지 않은 생존자 = 마지막 step 의 만료 X
      w_d: 0.5                  # 늦지 않은 발견 1 명당 (팀 공유, / N_T)
      discover_margin: 5       # T_m (step): 발견 시점에 남은 골든타임 τ_k - t 가 이보다 클 때만 발견 보상
      w_sw: 0.2                 # 자발적 역할 전환 penalty (/ N_T, 전환한 UAV 만)

# ---- 네트워크 (models/role/net.py): 역할 선택 네트워크 (독립 encoder · GNN, env.yaml model.gnn 설정)
#   노드 U (연결 + 메모리 노드) · S · F, 관계 S→U, U→S, F→U, U→F, U→U, S→S, F→F, S↔F (U–S / U–F 간선 층마다 갱신), attention 집계
#   logits = ξ_dec(h_i^L ‖ ξ_ctx(c_i)) ∈ R^3 (c_i = 그룹 context [ρ, η, ν, t / T_max]) -> role_mask -> softmax. RETURN 의 목표 = depot
model:
  custom_model_config:
    loss:
      lambda_role: 1.0          # L = λ_role L^role + λ_rescue L^rescue + λ_explore L^explore (training/role/ppo.py)
    role:
      entropy_coeff: 0.01       # role 엔트로피 보너스 계수
      value_norm: true          # V^role ValueNorm (MAPPO)
      critic:                     # role critic (CTDE rich critic, actor 와 인코더 비공유)
        cnn_filters: [[16, 3, 2], [32, 3, 2], [64, 3, 1]]   # critic CNN 층 [채널, 커널, stride]
        state_features: 128       # critic 중앙 state CNN 출력 차원
        local_features: 64        # critic local CNN 출력 차원
        hidden: [128, 64]         # critic MLP 은닉층
        set_dim: 64               # critic 조난자 / 팀 집합 임베딩 차원
        set_heads: 4              # critic 조난자 attention 헤드 수
