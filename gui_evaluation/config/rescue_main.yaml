# main_gui.py 전용 설정 (학습은 rescue.yaml 을 사용)
# Rescue 정책 설정 — 생존자 할당: 학습 / 규칙, rescue 보상 weight, 네트워크
# (env/role/simulation.py, policies/role_rules.py rule_rescue (담당 후보 / EDF), models/role/net.py 생존자 할당 네트워크)
# 학습: python -m training.train   (env.yaml + role.yaml + explore.yaml + rescue.yaml)
env_config:
  policy_mode: {rescue: learned}    # Rescue 헤드: learned = 학습 / rule = 그리디 (이벤트 1 / 2: 담당 후보 생존자,
                                    #   이벤트 3 / 4 / 5: EDF = 마감 빠른 순 -> 가까운 순 -> 번호)

  # ---- 보상 (env/role/simulation.py _rescue_event_reward, 이벤트 끝 그룹 공동 보상 S - F) ----
  #   G_res = 이번 이벤트에서 RESCUE 를 고른 같은 그룹 UAV, σ_u = τ_u - t - min_{l ∈ G_res} BFS(l, u) (이벤트 시점 위치)
  #   U_ε = 급한 생존자: 그룹이 아는 생존자 중 G_res 밖의 UAV (다른 그룹 포함) 가 맡지 않았고 0 <= σ_u <= ε
  #   S = G_res 가 할당했고 시간 안에 도착하는 생존자 수 (급함 여부 무관), F = U_ε 중 G_res 가 할당하지 않은 수
  #   R_i = (S - F) / N_T + 1[F = 0] [(1 - w_c) e^{-d} + w_c c̄_i] - w_dup · 1_dup,  d = Σ_{l ∈ G_res} BFS(l, a_l) / (d_max |G_res|)
  #   c̄_i = 결정 t0 ~ t1 (구조 완료 / 목표 무효 이벤트 5 / 에피소드 끝) 동안 개인 연결도 c_{i,t} = (|comp_t(i)| - 1) / (N - 1) 평균
  #   (실제 위치, 간선 = 거리 <= 기본 R_c — env.yaml rewards.connectivity). 보너스는 UAV 별 (옵션이 끝나는 step 에 지급)
  #   1_dup = 같은 생존자를 더 가까운 다른 UAV 가 쫓음. 학습: 옵션 단위 R_i (t1 에 확정, bootstrap 없음), A = R_i - V
  rewards:
    rescue:
      epsilon_urgent: 5   # 급한 생존자: 그룹 slack σ = τ − t − min_{G_res} BFS 가 0 ≤ σ ≤ 이 값
      w_c: 0.5   # 보너스 (F = 0) = (1 − w_c) e^{−d} + w_c · (옵션 동안 개인 연결도 평균)
      w_dup: 0.05

# ---- 네트워크 (models/role/net.py): 생존자 할당 네트워크 (독립 encoder · GNN, env.yaml model.gnn 설정)
#   노드 U (그룹의 RESCUE UAV, 이번 이벤트 앞 차례 포함) · S, 관계 S→U, U→S, U→U, S→S, U–S 간선 층마다 갱신
#   CapAM decoder: query = W_c [h_i^L ‖ t / T], 후보 F_j = Linear([h_{s_j}^L ‖ e_ij^L]) (후보 = S 노드 앞쪽, 할당 가능)
#   마스크 = 할당 가능 (발견 · 미구조 · 미만료 · 마감 전 도달 가능 · 그룹의 다른 UAV 가 안 맡음) & 그룹 앞 순서가 안 고름
#   (같은 생존자를 더 가까운 그룹원이 쫓는 경우는 마스크가 아니라 목표 무효 (이벤트 5) 로 처리)
model:
  custom_model_config:
    rescue:
      n_heads: 8                # CapAM decoder MHA 헤드 수 (glimpse)
      clip: 10.0                # pointer 점수 tanh clip 상수 C
      entropy_coeff: 0.01       # 이 헤드 엔트로피 보너스 계수
      value_norm: true          # 이 헤드 critic ValueNorm (MAPPO)
      critic:                     # rescue 헤드 critic (CTDE rich critic, actor 와 인코더 비공유)
        cnn_filters: [[16, 3, 2], [32, 3, 2], [64, 3, 1]]   # critic CNN 층 [채널, 커널, stride]
        state_features: 128       # critic 중앙 state CNN 출력 차원
        local_features: 64        # critic local CNN 출력 차원
        hidden: [128, 64]         # critic MLP 은닉층
        set_dim: 64               # critic 조난자 / 팀 집합 임베딩 차원
        set_heads: 4              # critic 조난자 attention 헤드 수
